name: BenApp
options:
  bundleIdPrefix: com.ben
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: '5.0'
  CODE_SIGNING_ALLOWED: 'NO'

targets:
  Ben:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Ben
        CFBundleName: Ben
        LSMinimumSystemVersion: '14.0'
        NSHighResolutionCapable: true
