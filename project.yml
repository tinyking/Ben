name: BenApp
options:
  bundleIdPrefix: com.ben
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: '5.0'
  CODE_SIGNING_ALLOWED: 'NO'

targets:
  Ben:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Ben
        CFBundleName: Ben
        LSMinimumSystemVersion: '14.0'
        NSHighResolutionCapable: true

  BenTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Ben
    settings:
      GENERATE_INFOPLIST_FILE: 'YES'
      BUNDLE_LOADER: '$(TEST_HOST)'
      TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Ben.app/Contents/MacOS/Ben'

schemes:
  Ben:
    build:
      targets:
        Ben: all
        BenTests: [test]
    test:
      targets:
        - BenTests
